# Render Blueprint: Mieliluotsi as one free web service built from the Dockerfile.
# Render → New → Blueprint → this repository. Every push to main deploys again.
services:
  - type: web
    name: mieliluotsi
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Claude by default. The key is set in Render's dashboard (ANTHROPIC_API_KEY), never in this file; without it the
      # demo texts are used and the AI switch says so.
      - key: VALITUKI_AI_MODE
        value: LIVE_AI_MODE
